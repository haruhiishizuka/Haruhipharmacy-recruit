<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88aab"/>
      <stop offset="40%" stop-color="#eda5b8"/>
      <stop offset="70%" stop-color="#f2bfb0"/>
      <stop offset="100%" stop-color="#f4b8a0"/>
    </linearGradient>
    <!-- Radial glow for bokeh circles -->
    <radialGradient id="bokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fce4ec" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fce4ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
    <!-- Cherry blossom petal shape -->
    <path id="petal" d="M0,-8 C3,-6 5,-2 5,0 C5,3 3,6 0,8 C-3,6 -5,3 -5,0 C-5,-2 -3,-6 0,-8Z"/>
    <!-- Single sakura flower (5 petals) -->
    <g id="sakura">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="2" fill="#fff" opacity="0.5"/>
    </g>
  </defs>

  <!-- Base gradient background -->
  <rect width="1366" height="768" fill="url(#bgGrad)"/>

  <!-- Soft light overlay for depth -->
  <rect width="1366" height="768" fill="url(#bgGrad)" opacity="0.3"/>

  <!-- Bokeh light circles - large, soft, abstract -->
  <circle cx="200" cy="150" r="180" fill="url(#bokeh1)"/>
  <circle cx="900" cy="100" r="250" fill="url(#bokeh2)"/>
  <circle cx="1200" cy="400" r="200" fill="url(#bokeh1)"/>
  <circle cx="400" cy="550" r="220" fill="url(#bokeh3)"/>
  <circle cx="700" cy="300" r="300" fill="url(#bokeh2)"/>
  <circle cx="100" cy="600" r="160" fill="url(#bokeh1)"/>
  <circle cx="1100" cy="650" r="180" fill="url(#bokeh3)"/>
  <circle cx="550" cy="80" r="140" fill="url(#bokeh1)"/>
  <circle cx="1300" cy="200" r="120" fill="url(#bokeh2)"/>
  <circle cx="350" cy="350" r="260" fill="url(#bokeh3)"/>

  <!-- Additional subtle light spots -->
  <circle cx="680" cy="600" r="100" fill="#ffffff" opacity="0.06"/>
  <circle cx="1050" cy="250" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="250" cy="400" r="130" fill="#ffffff" opacity="0.04"/>

  <!-- Sakura petals scattered across the scene -->
  <!-- Petal 1 - top left area, small -->
  <g transform="translate(180, 120) rotate(25) scale(1.8)" fill="#ffffff" opacity="0.2">
    <use href="#sakura"/>
  </g>

  <!-- Petal 2 - upper right, medium -->
  <g transform="translate(1050, 180) rotate(-15) scale(2.5)" fill="#ffffff" opacity="0.18">
    <use href="#sakura"/>
  </g>

  <!-- Petal 3 - center left, large -->
  <g transform="translate(320, 420) rotate(45) scale(3.0)" fill="#ffffff" opacity="0.15">
    <use href="#sakura"/>
  </g>

  <!-- Petal 4 - bottom right, medium -->
  <g transform="translate(1150, 550) rotate(-30) scale(2.2)" fill="#ffffff" opacity="0.22">
    <use href="#sakura"/>
  </g>

  <!-- Petal 5 - top center, small -->
  <g transform="translate(650, 90) rotate(60) scale(1.5)" fill="#ffffff" opacity="0.25">
    <use href="#sakura"/>
  </g>

  <!-- Petal 6 - lower left, large -->
  <g transform="translate(120, 620) rotate(10) scale(2.8)" fill="#ffffff" opacity="0.17">
    <use href="#sakura"/>
  </g>

  <!-- Petal 7 - center right, medium -->
  <g transform="translate(950, 400) rotate(-50) scale(2.0)" fill="#ffffff" opacity="0.2">
    <use href="#sakura"/>
  </g>

  <!-- Petal 8 - bottom center, small -->
  <g transform="translate(580, 650) rotate(35) scale(1.6)" fill="#ffffff" opacity="0.28">
    <use href="#sakura"/>
  </g>

  <!-- Scattered individual petals (single petal shapes floating) -->
  <g transform="translate(450, 200) rotate(80) scale(1.2)" fill="#ffffff" opacity="0.15">
    <use href="#petal"/>
  </g>
  <g transform="translate(800, 520) rotate(-20) scale(1.5)" fill="#ffffff" opacity="0.12">
    <use href="#petal"/>
  </g>
  <g transform="translate(1250, 320) rotate(55) scale(1.0)" fill="#ffffff" opacity="0.18">
    <use href="#petal"/>
  </g>
  <g transform="translate(70, 300) rotate(-65) scale(1.3)" fill="#ffffff" opacity="0.14">
    <use href="#petal"/>
  </g>
  <g transform="translate(1300, 680) rotate(40) scale(0.9)" fill="#ffffff" opacity="0.2">
    <use href="#petal"/>
  </g>
</svg>