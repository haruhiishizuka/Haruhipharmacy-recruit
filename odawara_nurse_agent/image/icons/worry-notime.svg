<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Background circle -->
  <circle cx="48" cy="48" r="44" fill="#fef2f6"/>
  <!-- Clock face -->
  <circle cx="40" cy="48" r="22" fill="#e88aab"/>
  <circle cx="40" cy="48" r="18" fill="#fff"/>
  <!-- Clock hour hand (filled rect) -->
  <rect x="38.5" y="34" width="3" height="15" rx="1.5" fill="#d47494"/>
  <!-- Clock minute hand (filled rect) -->
  <rect x="39" y="46" width="12" height="3" rx="1.5" fill="#d47494"/>
  <!-- Center dot -->
  <circle cx="40" cy="48" r="2.5" fill="#d47494"/>
  <!-- Speed arrows (filled triangles) -->
  <path d="M66 34l10 4-10 4z" fill="#d47494"/>
  <path d="M68 46l10 4-10 4z" fill="#e88aab"/>
  <path d="M66 58l10 4-10 4z" fill="#d47494"/>
  <!-- Speed lines (thin filled rects) -->
  <rect x="64" y="37" width="6" height="2" rx="1" fill="#e88aab"/>
  <rect x="66" y="49" width="6" height="2" rx="1" fill="#d47494"/>
  <rect x="64" y="61" width="6" height="2" rx="1" fill="#e88aab"/>
</svg>