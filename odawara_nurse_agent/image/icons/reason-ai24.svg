<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Background circle -->
  <circle cx="48" cy="48" r="44" fill="#fef2f6"/>
  <!-- Robot face -->
  <rect x="18" y="34" width="34" height="30" rx="9" fill="#e88aab"/>
  <!-- Antenna -->
  <rect x="33" y="24" width="4" height="12" rx="2" fill="#d47494"/>
  <circle cx="35" cy="23" r="4" fill="#d47494"/>
  <!-- Eyes -->
  <circle cx="29" cy="46" r="4" fill="#fff"/>
  <circle cx="41" cy="46" r="4" fill="#fff"/>
  <circle cx="30" cy="46" r="2" fill="#d47494"/>
  <circle cx="42" cy="46" r="2" fill="#d47494"/>
  <!-- Smile (filled arc) -->
  <path d="M29 54a7 4 0 0 0 12 0z" fill="#fff"/>
  <!-- 24h clock -->
  <circle cx="68" cy="48" r="17" fill="#d47494"/>
  <circle cx="68" cy="48" r="13" fill="#fff"/>
  <!-- 24h text -->
  <text x="68" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d47494">24</text>
  <text x="68" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#e88aab">h</text>
  <!-- Clock ticks (filled rects) -->
  <rect x="67" y="36" width="2" height="3" rx="1" fill="#d47494"/>
  <rect x="67" y="57" width="2" height="3" rx="1" fill="#d47494"/>
  <rect x="56" y="47" width="3" height="2" rx="1" fill="#d47494"/>
  <rect x="77" y="47" width="3" height="2" rx="1" fill="#d47494"/>
</svg>